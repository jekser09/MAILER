<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/index.css" rel="stylesheet" type="text/css">
    <script src="/js/index.js" defer></script>
    <title>Mailer</title>
</head>
<body>
    <h1>Mailer</h1>
    <form id="mailer-form">
        <div>
            <label for="inp-to">Para:</label>
            <input id="inp-to" name="to"/>
        </div>
        <div>
            <label for="inp-subject">Asunto:</label>
            <input id="inp-subject" name="subject"/>
        </div>
        <div>
            <label for="txta-msg">Mensaje:</label>
            <textarea id="txta-msg" name="html"></textarea>
        </div>
        <button type="submit">Enviar</button>
    </form>
    <div id="error"></div>
</body>
</html>
